name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Sign APK with permanent StanControl key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > stancontrol-release.jks
            APK="app/build/outputs/apk/debug/app-debug.apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks stancontrol-release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --out app-signed.apk "$APK"
            mv app-signed.apk "$APK"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
            rm -f stancontrol-release.jks
          else
            echo "Permanent signing key is not configured; keeping debug signature."
          fi
      - name: Package source project
        run: zip -r StanControl-source.zip . -x '.git/*' 'app/build/*' '.gradle/*'
      - uses: actions/upload-artifact@v4
        with:
          name: StanControl-source-project
          path: StanControl-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StanControl-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
